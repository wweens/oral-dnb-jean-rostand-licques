document.addEventListener('change',async e=>{if(e.target.id==='audioImport'&&e.target.files[0])importAudio(e.target.files[0]);if(e.target.id==='deckFile'&&e.target.files[0]){const f=e.target.files[0];if(f.size>20*1024*1024){toast('Support limité à 20 Mo.');return}try{const id=uid();await idb('files','readwrite',s=>s.put(f,id));if(state.deck)await idb('files','readwrite',s=>s.delete(state.deck.id));state.deck={id,name:f.name};persist();render()}catch{toast('Le support n’a pas pu être conservé.')}}});
$('#export').onclick=exportProject;$('#import').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{if(e.target.files[0])importProject(e.target.files[0]);e.target.value=''};$('#settings').onclick=settings;
window.addEventListener('beforeunload',e=>{if(recording){e.preventDefault();e.returnValue=''}if(saveTimer){try{localStorage.setItem(key,JSON.stringify(state))}catch{}}});

// Adaptation des trois fiches d'oral blanc du collège — octobre 2026.
const GUIDE_DOCS=[['L’essentiel et le planning annuel','1vv36fgs8heFIvdpJU1eS0JHlk8DX1hCZ'],['Faire un plan','1Ibu1QHAhJRh286O4YlyYyewBj9P3VJsR'],['Le diaporama','1AE_G27P_O-HJymkwAh37XGdKVnf9tuYf']];
const guideValue=k=>state.guide?.fields?.[k]||'';
function guideField(k,label,hint='',type='textarea'){return `<label class="field" for="guide-${k}">${label}</label>${type==='textarea'?`<textarea id="guide-${k}" data-guide-field="${k}">${esc(guideValue(k))}</textarea>`:`<input id="guide-${k}" data-guide-field="${k}" value="${esc(guideValue(k))}">`}${hint?`<p class="hint">${hint}</p>`:''}`}
function checks(group,items){return items.map((t,i)=>`<label class="check"><input type="checkbox" data-guide-check="${group}-${i}" ${state.guide?.checks?.[group+'-'+i]?'checked':''}>${t}</label>`).join('')}
function documentLinks(){return `<div class="actions">${GUIDE_DOCS.map(([t,id])=>`<a class="btn" href="https://drive.google.com/file/d/${id}/view" target="_blank" rel="noopener noreferrer">📄 ${t} ↗</a>`).join('')}</div>`}
function annualPlanning(){return panel('🗓️ Mon année, étape par étape',`<p>Ces repères suivent les fiches du collège. Les dates exactes et les rendez-vous sont communiqués par ton professeur principal.</p><div class="grid2"><div class="subcard"><h4>Septembre → décembre · Explorer</h4>${checks('term1',['Choisir mon sujet et en parler à mon professeur principal.','Faire une carte mentale : ce que je sais, mes questions, mes premières pistes.','Lire, classer mes recherches et noter les sources.','Demander à un professeur de devenir mon référent, puis lui montrer mes avancées.','Faire valider le choix du sujet selon le calendrier du collège.'])}</div><div class="subcard"><h4>Janvier → mars · Construire</h4>${checks('term2',['Rassembler les informations utiles et renommer clairement mes documents et images.','Affiner ma problématique et proposer mon plan.','Présenter mon plan détaillé et le résumé de chaque partie au référent, autour de février.','Préparer mon support et mes notes.'])}</div><div class="subcard"><h4>Avril → juin · S’entraîner</h4>${checks('term3',['Remettre la fiche de sujet, son contenu et les disciplines concernées.','Faire relire le support et vérifier son fonctionnement au collège.','M’entraîner avec mon support et des notes en mots-clés.','Passer l’oral blanc, prévu en mai selon le calendrier communiqué.','Reprendre les conseils du jury avant l’oral définitif, prévu en juin.'])}</div><div class="subcard"><h4>Mes prochains rendez-vous</h4>${guideField('nextMeeting','Ce que je dois montrer et quand','Exemple : mon plan et mes exemples, lors du prochain rendez-vous.','input')}${guideField('whiteDate','Date de mon oral blanc (quand elle est connue)','','input')}${guideField('finalDate','Date de mon oral définitif (quand elle est connue)','','input')}<p class="hint">Au CDI, demande les créneaux d’aide proposés cette année. Télécharge régulièrement ton dossier dans ton espace personnel.</p></div></div>`)}
function essentials(){return panel('🎯 Comprendre l’épreuve',`<div class="timeline"><span>Individuel : environ 5 min + 10 min</span><span>Note / 20 · coefficient 2</span></div><p style="margin-top:15px">Tu présentes un projet ou un objet d’étude relié à ton parcours scolaire. Le jury apprécie ton expression, tes connaissances, tes choix et ce que tu as appris. Le collège conseille le passage individuel ; ce carnet est conçu pour ce format.</p><p><strong>Session 2027 :</strong> expression orale : 8 points ; maîtrise du sujet : 12 points. La répartition de l’ancienne fiche est donc actualisée ici.</p><p class="hint"><a href="https://www.education.gouv.fr/bo/2026/Hebdo4/MENE2623228N" target="_blank" rel="noopener noreferrer">Consulter le texte national applicable à la session 2027 ↗</a></p><details><summary>Présenter une partie en langue vivante</summary><p>C’est possible, à déclarer lors du choix du sujet et à préparer avec ton professeur de langue. Le jury valorise une maîtrise satisfaisante ; cela ne garantit pas un bonus automatique. Le collège propose comme repère environ une minute, à confirmer avec tes professeurs.</p>${guideField('language','Mon éventuel choix de langue et ce que je présenterais','','input')}</details>`)}
function bibliographyHelp(){return panel('🔖 Citer mes sources avec précision',`<p>Une adresse seule ne suffit pas toujours. Complète la référence dans la fiche de chaque ressource et conserve les pages des passages utilisés.</p><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left">Document</th><th style="text-align:left">Informations à garder</th></tr></thead><tbody>${[['Livre','Titre, auteur, éditeur, année, pages ; cote si emprunté au CDI.'],['Article de revue ou journal','Titre de l’article, auteur, périodique, date, numéro, pages.'],['Encyclopédie / dictionnaire','Titre de l’article et de l’ouvrage, éditeur, date, pages.'],['Page web','Titre de la page, nom du site, auteur si indiqué, URL, date de consultation.'],['Image / vidéo','Auteur ou organisme, titre ou légende, origine, lien et date ; crédit et conditions d’usage si indiqués.']].map(([a,b])=>`<tr><td style="padding:10px;border-bottom:1px solid var(--line)">${a}</td><td style="padding:10px;border-bottom:1px solid var(--line)">${b}</td></tr>`).join('')}</tbody></table></div><p class="hint">Un chiffre ou une affirmation forte doit être associé à une source identifiable et vérifiée.</p><button class="btn soft" data-action="showBibliography">Voir / copier ma bibliographie</button>`)}
function bibliographyText(){return state.sources.map((s,i)=>`${i+1}. ${s.reference||[s.title,s.author,s.date,s.url].filter(Boolean).join(' — ')}${!s.reference?' [Référence à compléter si nécessaire]':''}`).join('\n')}
function openingClosing(){return panel('🗣️ Préparer le début et la fin',`<p>Rédige et répète ton introduction et ta conclusion pour entrer dans l’oral et en sortir avec assurance. Le développement s’appuie ensuite sur des notes en mots-clés.</p><h4>Introduction · dans cet ordre</h4>${guideField('introTheme','1. Présenter le thème et le contexte','Une entrée claire, sans généralisation non vérifiée.')}${guideField('introQuestion','2. Amener et formuler ma problématique','Tu peux reprendre la question de l’étape précédente ; explique ce qui la rend intéressante.')}${guideField('introPlan','3. Annoncer les grandes parties','« Tout d’abord… Puis… Enfin… » si trois parties sont utiles.')}<h4>Conclusion</h4>${guideField('closingSummary','1. Faire le bilan et répondre à la problématique','Rassemble les idées essentielles ; formule une réponse nuancée.')}${guideField('closingOpening','2. Proposer une ouverture pertinente','Une question liée au sujet, sans commencer un nouveau développement. Termine en remerciant le jury.')}`)}
function argumentHelp(){return panel('🔗 Un argument, un exemple, une explication',`<p>Chaque sous-partie défend une idée. Explique ton argument, donne un exemple précis et sourcé, puis dis ce que cet exemple montre. Une liste de noms ou de chiffres ne suffit pas.</p><div class="timeline"><span>Je défends une idée</span><span>Je l’illustre</span><span>J’explique le lien</span></div><p style="margin-top:15px"><strong>Pour guider l’écoute :</strong> « D’abord… », « En effet… », « Par exemple… », « Cependant… », « Ainsi… ».</p>${guideField('transitions','Mes phrases de transition entre les grandes parties','Résume ce qui vient d’être montré et annonce l’étape suivante.')}${checks('arguments',['Je comprends tous les mots que j’utilise.','J’explique mes exemples et leur lien avec la problématique.','Mes sources soutiennent vraiment mes affirmations.'])}`)}
function slideRules(){return panel('🎨 Les repères du collège pour le support',`<p><strong>Le diaporama est facultatif.</strong> Tu peux présenter des documents ou une autre réalisation. Choisis un support utile à ton propos.</p><label class="field" for="supportChoice">Mon choix de support</label><select id="supportChoice" data-guide-field="supportChoice">${['Diaporama','Documents ou autre réalisation','Sans support numérique'].map(v=>`<option ${guideValue('supportChoice')===v?'selected':''}>${v}</option>`).join('')}</select>${checks('slides',['Diapositive 1 : intitulé de l’exposé et illustration pertinente.','Diapositive 2 : plan avec parties et sous-parties.','Environ une diapositive par sous-partie, puis une conclusion ; un nombre raisonnable pour cinq minutes.','Deux ou trois idées maximum par diapositive, écrites en mots-clés.','Peu d’images : chacune a un rôle, une légende et une source.','Diapositives numérotées ; numéros reportés dans mes notes.','Sources citées aussi sur une diapositive de bibliographie finale.','Orthographe relue ; effets et animations limités.'])}${guideField('otherSupport','Si je choisis un autre support : ce que je montre et à quel moment')}`)}
function technicalChecklist(){return panel('🎒 Mon support prêt pour le jour J',`${checks('technical',['Je garde une version PDF de secours, même si je travaille sur Canva, Genially ou PowerPoint.','J’ai testé la lecture sur un ordinateur du collège.','Si je travaille dans LibreOffice Impress, je conserve aussi le fichier ODP.','Mes fichiers sont clairement nommés et j’en ai une seconde copie dans mon espace personnel.','Si je montre une vidéo, j’en prévois une copie autorisée pour éviter de dépendre de la connexion.','J’ai fait relire mon support par mon professeur référent.'])}<p class="hint">Ces vérifications sont manuelles. Cocher une case ne déclenche pas un export PDF ni un test de compatibilité.</p>`)}
function speakingNotes(){return panel('📝 Ma feuille de soutien',`<p>Prépare un plan détaillé en <strong>mots-clés</strong> : idée, exemple, référence utile et numéro de diapositive. Évite un texte intégral à lire pendant le développement.</p>${guideField('keywords','Mes notes de soutien','Tu peux organiser les lignes ainsi : I.A — idée / exemple / diapo 3.')}<button class="btn soft" data-action="showSpeakingSheet">Afficher / imprimer ma feuille de soutien</button>`)}
function whiteFeedback(){return panel('🌱 Après mon oral blanc',`<p>Les remarques du jury complètent la réécoute et les conseils de l’IA. Transforme-les en deux objectifs, puis réalise un nouvel essai.</p>${guideField('juryStrengths','Ce que le jury a trouvé réussi')}${guideField('juryAdvice','Ce que le jury m’a conseillé de reprendre')}${guideField('juryPriorities','Les deux améliorations que je choisis pour mon prochain essai')}`)}
function insertBeforeNext(content,extra){const marker='<div class="actions"><button class="btn soft" data-action="complete">';return content.includes(marker)?content.replace(marker,extra+marker):content+extra}
const originalViews={...views};
views[0]=()=>originalViews[0]()+essentials()+annualPlanning()+panel('📄 Les fiches distribuées au collège',`<p>Retrouve les documents de référence. La page adapte leur méthode au parcours avec l’IA et actualise les règles de la session 2027.</p>${documentLinks()}`);
views[1]=()=>insertBeforeNext(originalViews[1](),panel('🤝 Un projet accompagné',guideField('subjects','Les disciplines concernées par mon projet','','input')+guideField('referent','Mon professeur référent (information personnelle, conservée localement)','','input')+guideField('mindmap','Ma carte mentale : idées, questions, pistes','Tu peux aussi ajouter une photo ou un fichier de ta carte dans « Mes recherches ».')));
views[2]=()=>insertBeforeNext(originalViews[2](),bibliographyHelp());
views[4]=()=>insertBeforeNext(originalViews[4](),`<div class="notice">Le collège conseille généralement <strong>deux parties et deux ou trois sous-parties</strong> par partie. Une troisième partie reste possible si elle sert ta réponse et tient dans les cinq minutes. Fais relire ton plan détaillé et son résumé par ton référent.</div>`+openingClosing());
views[5]=()=>insertBeforeNext(originalViews[5](),argumentHelp());
views[6]=()=>insertBeforeNext(originalViews[6](),slideRules()+technicalChecklist());
views[7]=()=>insertBeforeNext(originalViews[7](),speakingNotes()+panel('👀 Ce que l’audio ne montre pas',checks('presence',['Je m’entraîne aussi devant une personne pour recevoir un retour sur le regard et la posture.','Je regarde mon auditoire et je me détache de mes notes.','Je répète mon introduction, mes transitions et ma conclusion.'])));
views[8]=()=>insertBeforeNext(originalViews[8](),whiteFeedback());
const originalBindFields=bindFields;
bindFields=function(){originalBindFields();document.querySelectorAll('[data-guide-field]').forEach(e=>e.addEventListener('input',()=>{state.guide=state.guide||{fields:{},checks:{}};state.guide.fields=state.guide.fields||{};state.guide.fields[e.dataset.guideField]=e.value;persist()}));document.querySelectorAll('[data-guide-check]').forEach(e=>e.addEventListener('change',()=>{state.guide=state.guide||{fields:{},checks:{}};state.guide.checks=state.guide.checks||{};state.guide.checks[e.dataset.guideCheck]=e.checked;persist()}))};
actions.showBibliography=()=>{const d=$('#modal');d.innerHTML=`<h2>Ma bibliographie</h2><textarea id="bibliographyText" style="min-height:260px">${esc(bibliographyText()||'Ajoute tes sources pour préparer ta bibliographie.')}</textarea><div class="actions"><button class="btn primary" id="copyBibliography">Copier</button><button class="btn" data-action="closeModal">Fermer</button></div>`;d.showModal();$('#copyBibliography').onclick=async()=>{try{await navigator.clipboard.writeText($('#bibliographyText').value);toast('Bibliographie copiée.')}catch{$('#bibliographyText').select();toast('Texte sélectionné : copie-le avec le menu de ton appareil.')}}};
actions.showSpeakingSheet=()=>{const d=$('#modal');d.innerHTML=`<div class="print-sheet"><h2>Ma feuille de soutien</h2><p><strong>${esc(state.project.theme)}</strong><br>${esc(state.project.problem)}</p><h3>Introduction préparée</h3>${['introTheme','introQuestion','introPlan'].map(k=>`<p>${esc(guideValue(k))}</p>`).join('')}<h3>Développement : mes mots-clés</h3><p style="white-space:pre-wrap">${esc(guideValue('keywords'))}</p><h3>Transitions</h3><p style="white-space:pre-wrap">${esc(guideValue('transitions'))}</p><h3>Conclusion préparée</h3><p>${esc(guideValue('closingSummary'))}</p><p>${esc(guideValue('closingOpening'))}</p></div><div class="actions"><button class="btn primary" id="printSheet">Imprimer / enregistrer en PDF</button><button class="btn" data-action="closeModal">Fermer</button></div>`;d.showModal();$('#printSheet').onclick=()=>{document.body.classList.add('printing-sheet');window.print();document.body.classList.remove('printing-sheet')}};

(async()=>{try{db=await openDB();const v=await idb('data','readonly',s=>s.get('project'));const backup=localStorage.getItem(key);state=v||blank();if(backup){try{const b=JSON.parse(backup);if(b.version===1)state=b;localStorage.removeItem(key);await idb('data','readwrite',s=>s.put(state,'project'))}catch{}}}catch{try{state=JSON.parse(localStorage.getItem(key))||blank()}catch{state=blank()}toast('Stockage des fichiers indisponible. Les notes peuvent être exportées.')}render()})();
</script></body></html>
